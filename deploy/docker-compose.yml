# One-command demo stack:
#
#   docker compose -f deploy/docker-compose.yml up --build -d
#
# Public gateway :8080, admin :9090, metrics :9100, Prometheus :9091,
# Grafana :3000. Redis and the three mock upstreams stay on the internal
# network. Copy deploy/.env.example to deploy/.env and replace the secrets
# before exposing the stack outside your machine.

x-gateway-service: &gateway-service
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      VERSION: ${VERSION:-dev}
  image: api-gateway-routing:${VERSION:-dev}
  restart: unless-stopped

services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gateway]

  mock-a:
    <<: *gateway-service
    command: ["/app/mockupstream", "-addr", ":9001", "-name", "mock-a"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9001/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [gateway]

  mock-b:
    <<: *gateway-service
    command: ["/app/mockupstream", "-addr", ":9001", "-name", "mock-b"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9001/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [gateway]

  mock-c:
    <<: *gateway-service
    command: ["/app/mockupstream", "-addr", ":9001", "-name", "mock-c"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9001/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [gateway]

  gateway:
    <<: *gateway-service
    command: ["-config", "/app/configs/gateway.compose.yaml"]
    environment:
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-development-only-secret}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-development-admin-token}
    ports:
      - "8080:8080"
      - "9090:9090"
      - "9100:9100"
    volumes:
      - ../configs/gateway.compose.yaml:/app/configs/gateway.compose.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      mock-a:
        condition: service_healthy
      mock-b:
        condition: service_healthy
      mock-c:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [gateway]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks: [gateway]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-development-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks: [gateway]

  k6:
    image: grafana/k6:0.54.0
    profiles: [load]
    command: ["run", "/scripts/baseline.js"]
    environment:
      BASE_URL: http://gateway:8080
      API_KEY: ${GATEWAY_DEMO_API_KEY:-gw_demo_demo-secret-123}
      K6_VUS: ${K6_VUS:-50}
      K6_DURATION: ${K6_DURATION:-30s}
    volumes:
      - ../bench/k6:/scripts:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks: [gateway]

volumes:
  prometheus-data:
  grafana-data:

networks:
  gateway:
    driver: bridge
